apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-predictor-ui
  namespace: house-predictor
spec:
  replicas: 2
  selector:
    matchLabels: {app: house-predictor-ui}
  template:
    metadata:
      labels: {app: house-predictor-ui}
    spec:
      containers:
        - name: streamlit
          image: ghcr.io/your-org/house-predictor:latest
          command: ["streamlit", "run", "streamlit_app/app.py", "--server.address=0.0.0.0"]
          ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata:
  name: house-predictor-ui
  namespace: house-predictor
spec:
  type: LoadBalancer
  selector: {app: house-predictor-ui}
  ports: [{port: 80, targetPort: 8501}]
