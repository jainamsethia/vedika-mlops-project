apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-predictor-api
  namespace: house-predictor
spec:
  replicas: 2
  selector:
    matchLabels: {app: house-predictor-api}
  template:
    metadata:
      labels: {app: house-predictor-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/house-predictor:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: house-predictor-api
  namespace: house-predictor
  labels: {app: house-predictor-api}
spec:
  selector: {app: house-predictor-api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: house-predictor-api
  namespace: house-predictor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: house-predictor-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
